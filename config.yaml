server:
  address: "localhost:8080"
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 30s

logger:
  level: "debug"
  encoding: "console"
  development: true

currency:
  default_rates:
    usd: 75.50
    eur: 90.25
    aed: 20.55
    gbp: 95.75

database:  # ✅ НОВАЯ СЕКЦИЯ
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "password"
  name: "currency_db"
  ssl_mode: "disable"
  max_conns: 10